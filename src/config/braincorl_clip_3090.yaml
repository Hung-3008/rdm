# BraInCoRL (CLIP preset) on a single RTX 3090 24 GB.
# Architecture and hyperparameters follow the original train.sh (batch 64, lr 1e-4,
# wd 0.1, dropout 0.5, context 30-500, 100 epochs); only precision / strategy differ
# (bf16-mixed on 1 GPU instead of 16-mixed FSDP over 8 GPUs).
# Measured on synthetic data, context 500, 20 layers, bf16: batch 16 -> 6.4 GiB,
# batch 32 -> 9.0 GiB, batch 64 -> 16.2 GiB peak (3.2 it/s).
seed: 0
out_dir: outputs/braincorl_clip_3090

data:
  source:
    name: npy_multisubj
    data_dir: data/braincorl/clip_b16   # from: python -m src.tools.preprocess_nsd (see src/README.md)
    train_subjects: [2, 5, 7]
    val_subjects: [2]
  batch_size: 64
  max_in_context: 500
  max_query: 100
  num_workers: 8

module:
  model:
    name: braincorl
    preset: CLIP
    num_layers: 20
    ffn_hidden_dim: 2048
    num_heads: 10
    num_reg_tokens: 4
    dropout: 0.5
  loss: {name: pmse}
  val_loss: {name: weight_cos_l2, lambda_l2: 1.0}
  min_in_context: 30
  max_in_context: 500
  lr: 1.0e-4
  weight_decay: 0.1

trainer:
  max_epochs: 100
  precision: bf16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  checkpoint:
    monitor: val_expl_var
    mode: max
    save_top_k: 3
  early_stopping_patience: 5
