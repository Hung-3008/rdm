# PopEB-v2 (docs/propose/propose01.md 9.6): K = 32 basis trained on S2/S5/S7 (outputs/propose01/sweep/K32_a1),
# population prior weighted by MNI distance (sigma 10 mm), pooled feature standardisation, lam0 = 10.
# tau2 keeps the K=16 ratio tau2 / mean population variance = 0.0227 (K16: 0.001 / 0.0443), so the config
# also applies to other hold-outs / bases (K32 on S2/S5/S7: 0.0314 -> 7.1e-4). All choices selected nested on S2/S5/S7.
seed: 0
out_dir: outputs/propose01/popeb_v2_s1

data:
  source:
    name: npy_multisubj
    data_dir: data/braincorl/clip_b16
    train_subjects: [2, 5, 7]
    val_subjects: [2]

basis:
  hidden_dim: 512
  basis_dim: 32
  lr: 1.0e-3
  head_weight_decay: 1.0e-4
  batch_size: 512
  max_epochs: 200
  patience: 10
  val_images: 500

fast:
  lambdas: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  tau2_ratio: 0.0227     # tau2 = ratio x mean population variance per dim (7.1e-4 for the K32 basis on S2/S5/S7)
  lam0: 10.0
  spatial_sigma: 10.0
  std_global: true
