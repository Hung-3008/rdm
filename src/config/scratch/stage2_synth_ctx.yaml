# Stage 2: context extension on the same synthetic voxels, context ~ U(0, 500)
# (paper: U(30, 500); 0 added so the model also sees the coordinate-only case).
seed: 0
out_dir: outputs/scratch/MODEL/stage2
data:
  source:
    name: synthetic
    embed_dim: 512
    num_img: 1000
    num_vxl: 16000
    num_train_subjects: 4
    num_val_subjects: 1
    noise_std: 1.5
    beta_std: 0.65
    with_coords: true
    coord_noise_frac: 0.5
    field_num_freq: 32
    field_sigma: 1.0
    seed: 0
  batch_size: 64
  max_in_context: 500
  max_query: 100
  num_workers: 6
module:
  model: {name: braincorl, preset: CLIP, num_layers: 20, ffn_hidden_dim: 2048, num_heads: 10, num_reg_tokens: 4, dropout: 0.1}
  loss: {name: pmse}
  val_loss: {name: weight_cos_l2, lambda_l2: 1.0}
  min_in_context: 0
  max_in_context: 500
  lr: 3.0e-4
  warmup_steps: 1000
  weight_decay: 1.0e-4
  init_weights: INIT
trainer:
  max_epochs: 15
  precision: bf16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  limit_val_batches: 0.5
  checkpoint: {monitor: val_expl_var, mode: max, save_top_k: 1}
  early_stopping_patience: 5
