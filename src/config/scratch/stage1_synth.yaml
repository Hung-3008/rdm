# Stage 1 (BraInCoRL Sec. 4.1): analysis-by-synthesis pretraining on synthetic linear voxels,
# fixed context of 100 (A.2; Sec. 4.1 says 500 - the two disagree, 100 chosen for speed). Synthetic voxels carry MNI-like coordinates with a spatially smooth
# weight field (coord_noise_frac = share of weight variance NOT explained by position).
seed: 0
out_dir: outputs/scratch/MODEL/stage1
data:
  source:
    name: synthetic
    embed_dim: 512
    num_img: 1000
    num_vxl: 16000
    num_train_subjects: 4
    num_val_subjects: 1
    noise_std: 1.5          # EV ceiling 1/(1+1.5^2) = 0.31
    beta_std: 0.65          # matches NSD betas after 3-repeat averaging
    with_coords: true
    coord_noise_frac: 0.5
    field_num_freq: 32
    field_sigma: 1.0
    seed: 0
  batch_size: 64
  max_in_context: 500
  max_query: 100
  num_workers: 6
module:
  model: {name: braincorl, preset: CLIP, num_layers: 20, ffn_hidden_dim: 2048, num_heads: 10, num_reg_tokens: 4, dropout: 0.1}
  loss: {name: pmse}
  val_loss: {name: weight_cos_l2, lambda_l2: 1.0}
  min_in_context: 100
  max_in_context: 100
  lr: 3.0e-4
  warmup_steps: 1000
  weight_decay: 1.0e-4
trainer:
  max_epochs: 40
  precision: bf16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  limit_val_batches: 0.5
  checkpoint: {monitor: val_expl_var, mode: max, save_top_k: 1}
  early_stopping_patience: 5
