# BraInCoRL + MNI coordinate token, held-out subject 1.
# Initialised from the released CLIP_trained_on_s257 weights (transformer + heads); only the
# coordinate encoder and the no-coord token start from scratch. Context length is sampled
# from U(0, 500) so the model also learns the zero-shot (coordinate-only) case.
seed: 0
out_dir: outputs/braincorl_coord_s1

data:
  source:
    name: npy_multisubj
    data_dir: data/braincorl/clip_b16
    train_subjects: [2, 5, 7]
    val_subjects: [2, 5, 7]
    with_coords: true
  batch_size: 64
  max_in_context: 500
  max_query: 100
  num_workers: 8

module:
  model:
    name: braincorl_coord
    preset: CLIP
    num_layers: 20
    ffn_hidden_dim: 2048
    num_heads: 10
    num_reg_tokens: 4
    dropout: 0.5
    num_freq: 64
    fourier_sigma: 2.0
    coord_scale_mm: 100.0
    jitter_mm: 2.0
    coord_token_dropout: 0.1
  loss: {name: pmse}
  val_loss: {name: weight_cos_l2, lambda_l2: 1.0}
  min_in_context: 0
  max_in_context: 500
  lr: 1.0e-4
  weight_decay: 0.1
  init_weights: references/BraInCoRL/checkpoints/CLIP_trained_on_s257.pth

trainer:
  max_epochs: 20
  precision: bf16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  limit_val_batches: 0.25
  checkpoint:
    monitor: val_expl_var
    mode: max
    save_top_k: 3
  early_stopping_patience: 5
