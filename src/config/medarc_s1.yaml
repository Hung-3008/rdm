# MedARC Algonauts 2025 feature encoder (src/model/medarc.py) adapted to NSD images, single subject:
# train on S1 unique images (9,000 minus 500 seeded validation images), test on the 1,000 shared images.
# Model / optimiser values follow references/algonauts2025/config/default_feature_encoding.yaml
# (embed_dim 192, avg pool, shared + subject decoder, AdamW lr 3e-4 wd 0.1); batch size, epochs and
# patience are set for 8,500 images instead of 2,000 x 64-TR clips.
seed: 0
out_dir: outputs/medarc/s1_default

data:
  root: data/braincorl_nsdgeneral
  subjects: [1]
  backbones: [clip_b16, dinov2_base, siglip_so400m]
  val_images: 500
  standardize: false     # true = per-dimension z-score with training statistics; unit-norm features had
                         # higher val Pearson (0.3229 vs 0.2964, scripts/medarc_sweep.sh)

model:
  embed_dim: 192
  global_pool: avg       # avg | linear | attn
  pool_num_heads: 4
  with_shared_decoder: true
  with_subject_decoders: true

train:
  batch_size: 256
  lr: 3.0e-4
  weight_decay: 0.1
  max_epochs: 200
  patience: 10           # reference stops at the first epoch without improvement (max 10 epochs)

eval:
  ridge: true            # ridge_cv_brainwise per backbone and on the concatenation, same training images
